name: Sync standby homepage

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-standby-homepage
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mirror the production homepage
        run: node scripts/sync-homepage.mjs
      - name: Verify standby invariants
        run: node scripts/verify-homepage.mjs
      - name: Commit a changed snapshot
        run: |
          git config user.name 'yamify-standby-bot'
          git config user.email 'support@yamify.co'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Sync standby homepage from yamify.co'
          git push
